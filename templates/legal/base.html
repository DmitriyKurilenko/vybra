{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page_title }} — Vybra</title>
    <link href="{% static 'css/tailwind.generated.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'css/meraki-ui.css' %}" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --brand: #FF4B2B;
            --brand-light: #FF6B4A;
            --brand-pale: #FFF0ED;
            --text-dark: #0F0F0F;
            --text-mid: #5A5A5A;
            --surface: #FAFAFA;
            --border: #EBEBEB;
        }

        * { box-sizing: border-box; }

        body {
            background: #FFFFFF;
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        .nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 100;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            background: rgba(255,255,255,0.85);
            border-bottom: 1px solid var(--border);
            height: 64px;
            display: flex;
            align-items: center;
        }

        .nav-inner {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-dark);
        }

        .nav-logo-icon {
            width: 36px;
            height: 36px;
            background: var(--brand);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-logo-text {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-ghost-nav {
            color: var(--text-mid);
            font-size: 14px;
            font-weight: 400;
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
        }

        .btn-ghost-nav:hover { background: var(--surface); color: var(--text-dark); }

        .btn-brand {
            background: var(--brand);
            color: #fff;
            font-weight: 500;
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: background 0.18s;
        }

        .btn-brand:hover { background: var(--brand-light); }

        .legal-shell {
            max-width: 900px;
            margin: 0 auto;
            padding: 108px 24px 56px;
        }

        .legal-title {
            font-size: clamp(30px, 4vw, 44px);
            line-height: 1.1;
            letter-spacing: -1px;
            font-weight: 800;
            margin: 0 0 8px;
        }

        .legal-date {
            font-size: 14px;
            color: var(--text-mid);
            margin-bottom: 28px;
        }

        .legal-content {
            font-size: 16px;
            line-height: 1.75;
            color: var(--text-dark);
        }

        .legal-content h3 {
            font-size: 22px;
            line-height: 1.3;
            margin: 26px 0 10px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .legal-content p { margin: 0 0 10px; }

        .legal-content ul {
            margin: 0 0 12px 0;
            padding-left: 20px;
        }

        .legal-content li { margin-bottom: 6px; }

        footer {
            border-top: 1px solid var(--border);
            margin-top: 24px;
            padding: 28px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }

        .footer-logo {
            font-weight: 700;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dark);
            text-decoration: none;
        }

        .footer-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .footer-link {
            font-size: 14px;
            color: var(--text-mid);
            text-decoration: none;
        }

        .footer-link:hover { color: var(--text-dark); }

        .footer-copy {
            font-size: 13px;
            color: var(--text-mid);
        }

        @media (max-width: 768px) {
            .legal-shell { padding: 96px 16px 44px; }
            footer { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <nav class="nav">
        <div class="nav-inner">
            <a href="/" class="nav-logo">
                <div class="nav-logo-icon">
                    <img src="{% static 'images/logo.svg' %}" alt="V" style="width:20px;height:20px;filter:brightness(0) invert(1);">
                </div>
                <span class="nav-logo-text">Vybra</span>
            </a>
            <div class="nav-actions">
                <a href="/login/" class="btn-ghost-nav">Войти</a>
                <a href="/register/" class="btn-brand">Регистрация</a>
            </div>
        </div>
    </nav>

    <main class="legal-shell">
        <h1 class="legal-title">{{ page_title }}</h1>
        <p class="legal-date">Дата публикации: 11 февраля 2026 г.</p>
        <div class="legal-content">
            {% block legal_content %}{% endblock %}
        </div>
    </main>

    <footer>
        <a href="/" class="footer-logo">
            <div class="nav-logo-icon" style="width:30px;height:30px;border-radius:8px;">
                <img src="{% static 'images/logo.svg' %}" alt="V" style="width:16px;height:16px;filter:brightness(0) invert(1);">
            </div>
            Vybra
        </a>
        <div class="footer-links">
            <a href="/login/" class="footer-link">Войти</a>
            <a href="/register/" class="footer-link">Регистрация</a>
            <a href="/legal/terms/" class="footer-link">Пользовательское соглашение</a>
            <a href="/legal/privacy/" class="footer-link">Политика конфиденциальности</a>
            <a href="/legal/contacts/" class="footer-link">Реквизиты</a>
        </div>
        <div class="footer-copy">© 2026 Vybra</div>
    </footer>
</body>
</html>
