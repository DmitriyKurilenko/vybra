{% extends "base.html" %}

{% block title %}Сравнение - Vybra{% endblock %}

{% block content %}
<div x-data="compare()" x-init="init()" class="page-shell space-y-3 sm:space-y-4">
    <!-- Mobile Split-Screen View -->
    <div x-show="!loading && item1 && item2" class="md:hidden flex flex-col gap-1">
        <!-- Item 1 - Top Half -->
        <div @click="submitComparison(item1)"
               class="card bg-base-100 cursor-pointer active:bg-base-200 transition-colors touch-manipulation flex flex-row items-center p-2 h-[30vh]"
             :class="{'opacity-50': loading}">
            <!-- Image Left -->
            <div x-data="{ imgFailed: false }" class="relative w-1/2 h-full pr-1 bg-base-200 overflow-hidden">
                <template x-if="hasImage(item1) && !imgFailed">
                    <img :src="item1 ? item1.image_url : ''"
                         :alt="item1 ? item1.name : ''"
                         @error="imgFailed = true"
                         loading="eager"
                         class="absolute inset-0 object-contain h-full w-full p-2">
                </template>
                <template x-if="!hasImage(item1) || imgFailed">
                    <div class="absolute inset-0 text-base-content/40 bg-base-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-1/2 top-1/2 h-10 w-10 -translate-x-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-8h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>
                </template>
            </div>
            <!-- Info Right -->
            <div class="w-1/2 h-full flex flex-col justify-center items-start pl-1">
                <h2 class="text-sm font-semibold leading-snug line-clamp-2 mb-2" x-text="item1 ? item1.name : ''"></h2>
                <div class="flex gap-1 flex-wrap mb-1">
                    <div class="badge badge-primary badge-xs" x-text="'Степень готовности: ' + (item1 ? (item1.confidence || 0) : 0) + '%' "></div>
                    <div class="badge badge-accent badge-xs" x-text="'Категория: ' + (item1 ? (item1.category || '—') : '—')"></div>
                </div>
                <p class="text-lg font-bold text-primary" x-text="item1 && item1.price ? item1.price + ' ₽' : '-'"></p>
            </div>
        </div>

        <!-- Item 2 - Bottom Half -->
        <div @click="submitComparison(item2)"
               class="card bg-base-100 cursor-pointer active:bg-base-200 transition-colors touch-manipulation flex flex-row items-center p-2 h-[30vh]"
             :class="{'opacity-50': loading}">
            <!-- Image Left -->
            <div x-data="{ imgFailed: false }" class="relative w-1/2 h-full pr-1 bg-base-200 overflow-hidden">
                <template x-if="hasImage(item2) && !imgFailed">
                    <img :src="item2 ? item2.image_url : ''"
                         :alt="item2 ? item2.name : ''"
                         @error="imgFailed = true"
                         loading="eager"
                         class="absolute inset-0 object-contain h-full w-full p-2">
                </template>
                <template x-if="!hasImage(item2) || imgFailed">
                    <div class="absolute inset-0 text-base-content/40 bg-base-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-1/2 top-1/2 h-10 w-10 -translate-x-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-8h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>
                </template>
            </div>
            <!-- Info Right -->
            <div class="w-1/2 h-full flex flex-col justify-center items-start pl-1">
                <h2 class="text-sm font-semibold leading-snug line-clamp-2 mb-2" x-text="item2 ? item2.name : ''"></h2>
                <div class="flex gap-1 flex-wrap mb-1">
                    <div class="badge badge-primary badge-xs" x-text="'Степень готовности: ' + (item2 ? (item2.confidence || 0) : 0) + '%' "></div>
                    <div class="badge badge-accent badge-xs" x-text="'Категория: ' + (item2 ? (item2.category || '—') : '—')"></div>
                </div>
                <p class="text-lg font-bold text-primary" x-text="item2 && item2.price ? item2.price + ' ₽' : '-'"></p>
            </div>
        </div>
    </div>

    <!-- Desktop Card View -->
    <div x-show="!loading && item1 && item2" class="hidden md:grid grid-cols-2 gap-6 lg:gap-8 mb-6 md:mb-8">
        <!-- Item 1 -->
        <div @click="submitComparison(item1)"
               class="card bg-base-100 cursor-pointer hover:bg-base-100/90 transition-colors"
             :class="{'opacity-50': loading}">
            <figure x-data="{ imgFailed: false }" class="relative h-72 bg-base-200 overflow-hidden">
                <template x-if="hasImage(item1) && !imgFailed">
                    <img :src="item1 ? item1.image_url : ''"
                         :alt="item1 ? item1.name : ''"
                         @error="imgFailed = true"
                         loading="eager"
                         class="absolute inset-0 object-contain h-full w-full p-2">
                </template>
                <template x-if="!hasImage(item1) || imgFailed">
                    <div class="absolute inset-0 text-base-content/40 bg-base-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-1/2 top-1/2 h-12 w-12 -translate-x-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-8h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>
                </template>
            </figure>
            <div class="card-body p-5 lg:p-6">
                <h2 class="card-title text-lg line-clamp-2" x-text="item1 ? item1.name : ''"></h2>
                <div class="flex items-center gap-2 mt-1">
                    <div class="badge badge-primary" x-text="'Степень готовности: ' + (item1 ? (item1.confidence || 0) : 0) + '%' "></div>
                </div>
                <div class="flex gap-2 flex-wrap mt-2 mb-1">
                    <div class="badge badge-accent" x-text="'Категория: ' + (item1 ? (item1.category || '—') : '—')"></div>
                </div>
                <p class="text-3xl font-bold text-primary mt-2" x-text="item1 && item1.price ? item1.price + ' ₽' : 'Цена не указана'"></p>
                <a :href="item1 ? item1.url : '#'" target="_blank" class="btn btn-md btn-outline mt-3 min-h-[44px]" @click.stop>
                    Открыть ссылку
                </a>
            </div>
        </div>

        <!-- Item 2 -->
        <div @click="submitComparison(item2)"
               class="card bg-base-100 cursor-pointer hover:bg-base-100/90 transition-colors"
             :class="{'opacity-50': loading}">
            <figure x-data="{ imgFailed: false }" class="relative h-72 bg-base-200 overflow-hidden">
                <template x-if="hasImage(item2) && !imgFailed">
                    <img :src="item2 ? item2.image_url : ''"
                         :alt="item2 ? item2.name : ''"
                         @error="imgFailed = true"
                         loading="eager"
                         class="absolute inset-0 object-contain h-full w-full p-2">
                </template>
                <template x-if="!hasImage(item2) || imgFailed">
                    <div class="absolute inset-0 text-base-content/40 bg-base-200">
                        <svg xmlns="http://www.w3.org/2000/svg" class="absolute left-1/2 top-1/2 h-12 w-12 -translate-x-1/2 -translate-y-1/2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-8h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                        </svg>
                    </div>
                </template>
            </figure>
            <div class="card-body p-5 lg:p-6">
                <h2 class="card-title text-lg line-clamp-2" x-text="item2 ? item2.name : ''"></h2>
                <div class="flex items-center gap-2 mt-1">
                    <div class="badge badge-primary" x-text="'Степень готовности: ' + (item2 ? (item2.confidence || 0) : 0) + '%' "></div>
                </div>
                <div class="flex gap-2 flex-wrap mt-2 mb-1">
                    <div class="badge badge-accent" x-text="'Категория: ' + (item2 ? (item2.category || '—') : '—')"></div>
                </div>
                <p class="text-3xl font-bold text-primary mt-2" x-text="item2 && item2.price ? item2.price + ' ₽' : 'Цена не указана'"></p>
                <a :href="item2 ? item2.url : '#'" target="_blank" class="btn btn-md btn-outline mt-3 min-h-[44px]" @click.stop>
                    Открыть ссылку
                </a>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div x-show="loading" class="flex justify-center items-center h-48 sm:h-64">
        <span class="loading loading-spinner loading-lg"></span>
    </div>

    <!-- No Items State -->
    <div x-show="!loading && !item1" class="alert alert-warning text-sm sm:text-base">
        <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current flex-shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
        <span>Недостаточно товаров для сравнения. Добавьте минимум 2 товара.</span>
        <a href="/items/" class="btn btn-sm sm:btn-md min-h-[44px]">Добавить товары</a>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script>
function compare() {
    return {
        sessionType: 'all',
        item1: null,
        item2: null,
        loading: false,
        comparisonsCount: 0,
        
        async init() {
            if (!requireAuth()) return;
            await this.loadPair();
        },

        async setSessionType(type) {
            this.sessionType = type;
            this.comparisonsCount = 0;
            await this.loadPair();
        },

        async loadPair() {
            this.loading = true;

            try {
                const response = await authFetch(`/api/wishlist/compare/pair?session_type=${this.sessionType}`);
                const data = await response.json();

                if (data.error) {
                    this.item1 = null;
                    this.item2 = null;
                } else {
                    this.item1 = this.prepareItemImageState(data.item1);
                    this.item2 = this.prepareItemImageState(data.item2);
                }
            } catch (error) {
                console.error('Error loading pair:', error);
                this.notify('Сравнение', 'Ошибка загрузки пары товаров', 'error');
            } finally {
                this.loading = false;
            }
        },

        normalizeImageUrl(rawImageUrl) {
            const raw = typeof rawImageUrl === 'string' ? rawImageUrl.trim() : '';
            if (!raw) return null;

            const normalized = raw.toLowerCase();
            if (['none', 'null', 'undefined'].includes(normalized)) return null;
            if (normalized.includes('via.placeholder.com')) return null;
            if (normalized.startsWith('data:image')) return raw;

            if (raw.startsWith('//')) return `https:${raw}`;

            if (!raw.startsWith('http://') && !raw.startsWith('https://')) return null;

            return raw;
        },

        hasImage(item) {
            return !!(item && item.image_url);
        },

        prepareItemImageState(item) {
            if (!item) return null;

            return {
                ...item,
                image_url: this.normalizeImageUrl(item.image_url),
            };
        },

        async submitComparison(winner) {
            if (!winner || this.loading) return;

            this.loading = true;

            try {
                const response = await authFetch('/api/wishlist/compare', {
                    method: 'POST',
                    body: JSON.stringify({
                        item1_id: this.item1.id,
                        item2_id: this.item2.id,
                        winner_id: winner.id
                    })
                });

                if (response.ok) {
                    this.comparisonsCount++;
                    await this.loadPair();
                } else {
                    this.notify('Сравнение', 'Не удалось сохранить результат сравнения', 'error');
                }
            } catch (error) {
                console.error('Error submitting comparison:', error);
                this.notify('Сравнение', 'Ошибка при сохранении сравнения', 'error');
                this.loading = false;
            }
        },

        notify(title, message, type = 'info') {
            window.dispatchEvent(new CustomEvent('vybra:notify', {
                detail: { title, message, type, createdAt: Date.now() }
            }));
        },

        getConfidenceStars(confidenceLevel) {
            const labels = {
                'very_low': 'Низкая',
                'low': 'Ниже средней',
                'medium': 'Средняя',
                'high': 'Высокая',
                'very_high': 'Очень высокая'
            };
            return labels[confidenceLevel] || 'Средняя';
        }
    }
}
</script>
{% endblock %}
