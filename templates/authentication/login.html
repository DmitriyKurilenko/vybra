<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Vybra</title>

    <!-- Precompiled Tailwind CSS -->
    <link href="{% static 'css/tailwind.generated.css' %}" rel="stylesheet" type="text/css" />
    <link href="{% static 'css/meraki-ui.css' %}" rel="stylesheet" type="text/css" />

    <style>
        :root {
            --brand: #FF4B2B;
            --brand-light: #FF6B4A;
            --brand-pale: #FFF0ED;
            --text-dark: #0F0F0F;
            --text-mid: #5A5A5A;
            --surface: #FAFAFA;
            --border: #EBEBEB;
        }

        body {
            background: #fff;
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .btn-primary {
            background: var(--brand) !important;
            border-color: var(--brand) !important;
            color: #fff !important;
        }

        .btn-primary:hover {
            background: var(--brand-light) !important;
            border-color: var(--brand-light) !important;
        }

        .card {
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 2px 10px rgba(15, 15, 15, 0.04);
        }

        .app-nav {
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 1px solid var(--border);
            min-height: 64px;
        }

        .app-logo-icon {
            width: 36px;
            height: 36px;
            background: var(--brand);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .auth-shell {
            min-height: calc(100vh - 64px);
            padding-top: 1rem;
            padding-bottom: 1rem;
        }

        .auth-card {
            width: 100%;
            max-width: 28rem;
        }

        .auth-card .input,
        .auth-card .btn {
            min-height: 44px;
        }

        @media (max-width: 639px) {
            .app-nav .navbar-start .btn {
                padding-left: 0.5rem;
                padding-right: 0.5rem;
                gap: 0.5rem;
            }

            .auth-shell {
                align-items: flex-start;
                padding-top: 0.75rem;
            }

            .auth-card .card-body {
                padding: 1rem;
            }

            .auth-card .card-title {
                font-size: 1.5rem;
                line-height: 1.2;
            }
        }

    </style>

    <!-- AlpineJS -->
    <script defer src="{% static 'vendor/js/alpine.min.js' %}"></script>
        <script src="{% static 'js/utils.js' %}?v=20260221"></script>

    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body>
    <!-- Navigation -->
    <div class="navbar app-nav px-3 sm:px-4">
        <div class="navbar-start">
            <a class="btn btn-ghost text-lg sm:text-xl normal-case gap-2" href="/">
                <span class="app-logo-icon">
                    <img src="{% static 'images/logo.svg' %}" alt="Vybra" class="h-5 w-5" style="filter:brightness(0) invert(1);">
                </span>
                <span class="font-bold">Vybra</span>
            </a>
        </div>
        <div class="navbar-end">
            <a href="/register/" class="btn btn-primary min-h-[44px]">Регистрация</a>
        </div>
    </div>

    <!-- Login Form -->
    <div class="auth-shell flex items-center justify-center p-4 sm:p-6" x-data="loginForm()">
        <div class="auth-card card bg-base-100 shadow-xl">
            <div class="card-body p-5 sm:p-6">
                <h2 class="card-title text-3xl mb-5 sm:mb-6 justify-center">Вход в Vybra</h2>

                <!-- Error Alert -->
                <div x-show="error" x-cloak class="alert alert-error mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-6 w-6" fill="none" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span x-text="error"></span>
                </div>

                <!-- Login Form -->
                <form @submit.prevent="submitLogin()">
                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text">Email</span>
                        </label>
                        <input
                            type="email"
                            x-model="email"
                            placeholder="your@email.com"
                            class="input input-bordered"
                            required
                            :disabled="loading">
                    </div>

                    <div class="form-control mb-6">
                        <label class="label">
                            <span class="label-text">Пароль</span>
                        </label>
                        <input
                            type="password"
                            x-model="password"
                            placeholder="••••••••"
                            class="input input-bordered"
                            required
                            :disabled="loading">
                        <label class="label">
                            <a href="#" class="label-text-alt link link-hover">Забыли пароль?</a>
                        </label>
                    </div>

                    <div class="form-control">
                        <button
                            type="submit"
                            class="btn btn-primary"
                            :disabled="loading">
                            <span x-show="!loading">Войти</span>
                            <span x-show="loading" class="loading loading-spinner"></span>
                        </button>
                    </div>
                </form>

                <!-- Divider -->
                <div class="divider">
                    
                </div>

                {% if google_enabled %}
                <div class="mb-4">
                    <a href="/google/login/"
                       style="display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:44px;background:#fff;border:1px solid #DADCE0;border-radius:4px;padding:0 16px;font-family:'Roboto',Arial,sans-serif;font-size:14px;font-weight:500;color:#3C4043;text-decoration:none;box-shadow:0 1px 2px rgba(60,64,67,.08);transition:box-shadow .15s,background .15s;"
                       onmouseover="this.style.boxShadow='0 2px 6px rgba(60,64,67,.20)';this.style.background='#F8FAFE';"
                       onmouseout="this.style.boxShadow='0 1px 2px rgba(60,64,67,.08)';this.style.background='#fff';">
                        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
                            <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
                            <path d="M3.964 10.707A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
                            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
                        </svg>
                        Войти через Google
                    </a>
                </div>
                {% endif %}

                <!-- Register Link -->
                <div class="text-center">
                    <p class="text-sm opacity-70">
                        Нет аккаунта?
                        <a href="/register/" class="link link-primary font-semibold">Зарегистрируйтесь</a>
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loginForm() {
            return {
                email: '',
                password: '',
                loading: false,
                error: null,

                async submitLogin() {
                    // Validation
                    if (!this.email || !this.password) {
                        this.error = 'Пожалуйста, заполните все поля';
                        return;
                    }

                    this.loading = true;
                    this.error = null;
                        beginGlobalLoading();

                    try {
                        const response = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                email: this.email,
                                password: this.password
                            })
                        });

                        const data = await response.json();

                        if (response.ok) {
                            // Save tokens to localStorage
                            localStorage.setItem('access_token', data.access_token);
                            localStorage.setItem('refresh_token', data.refresh_token);

                            // Redirect to dashboard
                            window.location.href = '/dashboard/';
                        } else {
                            this.error = data.error || 'Неверный email или пароль';
                        }
                    } catch (error) {
                        console.error('Login error:', error);
                        this.error = 'Ошибка подключения к серверу';
                    } finally {
                            endGlobalLoading();
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
