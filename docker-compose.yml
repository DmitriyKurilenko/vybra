services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: vybra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: postgres -c shared_buffers=128MB -c max_connections=40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vybra"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  web:
    build: .
    command: sh -c "python manage.py migrate --noinput && gunicorn vybra.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 2 --timeout 60 --keep-alive 5 --max-requests 300 --max-requests-jitter 30 --access-logfile - --error-logfile -"
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECURE_SSL_REDIRECT=False
      - ALLOWED_HOSTS=*
      - SECRET_KEY=dev-only-insecure-key-do-not-use-in-prod
      - JWT_SECRET_KEY=dev-only-jwt-key-do-not-use-in-prod
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=vybra
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A vybra worker -l info --pool=solo --concurrency=1 --without-gossip --without-mingle --without-heartbeat --max-tasks-per-child=100
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost
      - SECRET_KEY=dev-only-insecure-key-do-not-use-in-prod
      - JWT_SECRET_KEY=dev-only-jwt-key-do-not-use-in-prod
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=vybra
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
      - SELENIUM_REMOTE_URL=http://selenium:4444/wd/hub
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      selenium:
        condition: service_healthy

  selenium:
    image: selenium/standalone-chromium:4
    shm_size: 256m
    environment:
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_SESSION_TIMEOUT=120
      - SE_VNC_NO_PASSWORD=1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4444/wd/hub/status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  celery-beat:
    build: .
    command: celery -A vybra beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    environment:
      - DEBUG=False
      - ALLOWED_HOSTS=localhost
      - SECRET_KEY=dev-only-insecure-key-do-not-use-in-prod
      - JWT_SECRET_KEY=dev-only-jwt-key-do-not-use-in-prod
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=vybra
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  media_data:
