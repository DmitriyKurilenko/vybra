services:
  db:
    image: postgres:17
    restart: unless-stopped
    command: postgres -c shared_buffers=32MB -c work_mem=1MB -c maintenance_work_mem=8MB -c max_connections=15
    environment:
      POSTGRES_DB: ${DB_NAME:-vybra}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vybra}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 96m
    cpus: 0.15
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 32mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 40m
    cpus: 0.05
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  web:
    restart: unless-stopped
    init: true
    image: vybra-web:latest
    # migrate вынесен в команду web — для single-replica деплоя это безопасно.
    # При горизонтальном масштабировании используйте отдельный init-контейнер.
    command: sh -c "python manage.py collectstatic --noinput && python manage.py migrate --noinput && gunicorn vybra.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 2 --timeout 120 --keep-alive 5 --max-requests 250 --max-requests-jitter 25 --access-logfile - --error-logfile -"
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-vybra}
      - DB_USER=${DB_USER:-postgres}
      - DB_CONN_MAX_AGE=45
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - SECURE_SSL_REDIRECT=True
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-31536000}
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=True
      - SECURE_HSTS_PRELOAD=True
      - PARSED_PRODUCT_CACHE_TTL=${PARSED_PRODUCT_CACHE_TTL:-172800}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DJANGO_LOG_LEVEL=${DJANGO_LOG_LEVEL:-WARNING}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/ >/dev/null"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 30s
    mem_limit: 128m
    cpus: 0.22
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.vybra-web.rule=Host(`${TRAEFIK_HOST:-vybra.localhost}`)"
      - "traefik.http.routers.vybra-web.entrypoints=websecure"
      - "traefik.http.routers.vybra-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.vybra-web.loadbalancer.server.port=8000"
    networks:
      - traefik

  celery:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: Dockerfile.worker
    command: celery -A vybra worker -l info --pool=solo --concurrency=1 --without-gossip --without-mingle --without-heartbeat --prefetch-multiplier=1 --max-tasks-per-child=50 --max-memory-per-child=80000
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-vybra}
      - DB_USER=${DB_USER:-postgres}
      - DB_CONN_MAX_AGE=45
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - PARSED_PRODUCT_CACHE_TTL=${PARSED_PRODUCT_CACHE_TTL:-172800}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - SELENIUM_REMOTE_URL=http://selenium:4444/wd/hub
      - WB_BATCH_PARSE_RETRIES=${WB_BATCH_PARSE_RETRIES:-2}
      - WB_BATCH_PARSE_TIMEOUT=${WB_BATCH_PARSE_TIMEOUT:-25}
      - WB_PARSER_RETRY_ATTEMPTS=${WB_PARSER_RETRY_ATTEMPTS:-2}
      - WB_PARSER_RETRY_BASE_DELAY=${WB_PARSER_RETRY_BASE_DELAY:-1.2}
      - WB_PARSER_RETRY_MAX_DELAY=${WB_PARSER_RETRY_MAX_DELAY:-6}
      - WB_PARSER_RETRY_JITTER=${WB_PARSER_RETRY_JITTER:-0.2}
      - WB_PARSER_RESTART_SESSION_ON_RETRY=${WB_PARSER_RESTART_SESSION_ON_RETRY:-false}
      - SELENIUM_SLEEP_SCALE=${SELENIUM_SLEEP_SCALE:-0.8}
      - TASK_PROGRESS_STEP=${TASK_PROGRESS_STEP:-25}
      - IMPORT_FAVORITES_DELAY_SEC=${IMPORT_FAVORITES_DELAY_SEC:-0.25}
      - WB_NIGHTLY_RECOVERY_BATCH_SIZE=${WB_NIGHTLY_RECOVERY_BATCH_SIZE:-20}
      - WB_NIGHTLY_RECOVERY_RETRIES=${WB_NIGHTLY_RECOVERY_RETRIES:-3}
      - WB_NIGHTLY_RECOVERY_TIMEOUT=${WB_NIGHTLY_RECOVERY_TIMEOUT:-35}
      - WB_NIGHTLY_RECOVERY_COOLDOWN_HOURS=${WB_NIGHTLY_RECOVERY_COOLDOWN_HOURS:-20}
      - WB_NIGHTLY_RECOVERY_ENABLED=${WB_NIGHTLY_RECOVERY_ENABLED:-true}
      - WB_NIGHTLY_RECOVERY_HOUR=${WB_NIGHTLY_RECOVERY_HOUR:-3}
      - WB_NIGHTLY_RECOVERY_MINUTE=${WB_NIGHTLY_RECOVERY_MINUTE:-20}
      - WB_NIGHTLY_RECOVERY_CRON_HOUR=${WB_NIGHTLY_RECOVERY_CRON_HOUR:-0-6}
      - WB_NIGHTLY_RECOVERY_CRON_MINUTE=${WB_NIGHTLY_RECOVERY_CRON_MINUTE:-*/20}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      selenium:
        condition: service_healthy
    mem_limit: 96m
    cpus: 0.18
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  selenium:
    image: selenium/standalone-chromium:4
    restart: unless-stopped
    shm_size: 128m
    environment:
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_SESSION_TIMEOUT=120
      - SE_VNC_NO_PASSWORD=1
      - SE_START_VNC=false
      - SE_OPTS=--log-level WARNING
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4444/wd/hub/status"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    mem_limit: 384m
    cpus: 0.35
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  celery-beat:
    restart: unless-stopped
    init: true
    image: vybra-web:latest
    command: celery -A vybra beat -l info -s /tmp/celerybeat-schedule
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-vybra}
      - DB_USER=${DB_USER:-postgres}
      - DB_CONN_MAX_AGE=45
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      - WB_NIGHTLY_RECOVERY_ENABLED=${WB_NIGHTLY_RECOVERY_ENABLED:-true}
      - WB_NIGHTLY_RECOVERY_HOUR=${WB_NIGHTLY_RECOVERY_HOUR:-3}
      - WB_NIGHTLY_RECOVERY_MINUTE=${WB_NIGHTLY_RECOVERY_MINUTE:-20}
      - WB_NIGHTLY_RECOVERY_CRON_HOUR=${WB_NIGHTLY_RECOVERY_CRON_HOUR:-0-6}
      - WB_NIGHTLY_RECOVERY_CRON_MINUTE=${WB_NIGHTLY_RECOVERY_CRON_MINUTE:-*/20}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 32m
    cpus: 0.05
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  media_data:

networks:
  traefik:
    external: true
