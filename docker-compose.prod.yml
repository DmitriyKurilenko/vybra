services:
  db:
    image: postgres:17
    restart: unless-stopped
    command: postgres -c shared_buffers=32MB -c work_mem=1MB -c maintenance_work_mem=8MB -c max_connections=15
    environment:
      POSTGRES_DB: ${DB_NAME:-vybra}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-vybra}"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 96m
    cpus: 0.15
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no --maxmemory 32mb --maxmemory-policy allkeys-lru
    sysctls:
      - net.core.somaxconn=511
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 40m
    cpus: 0.05
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  web:
    restart: unless-stopped
    init: true
    build: .
    image: vybra-web:latest
    # migrate вынесен в команду web — для single-replica деплоя это безопасно.
    # При горизонтальном масштабировании используйте отдельный init-контейнер.
    command: sh -c "python manage.py migrate --noinput && gunicorn vybra.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 2 --timeout 120 --keep-alive 5 --max-requests 250 --max-requests-jitter 25 --access-logfile - --error-logfile -"
    environment:
      - DEBUG=False
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-vybra}
      - DB_USER=${DB_USER:-postgres}
      - DB_CONN_MAX_AGE=45
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in .env}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY in .env}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      - SECURE_SSL_REDIRECT=True
      - SESSION_COOKIE_SECURE=True
      - CSRF_COOKIE_SECURE=True
      - SECURE_HSTS_SECONDS=${SECURE_HSTS_SECONDS:-31536000}
      - SECURE_HSTS_INCLUDE_SUBDOMAINS=True
      - SECURE_HSTS_PRELOAD=True
      - PARSED_PRODUCT_CACHE_TTL=${PARSED_PRODUCT_CACHE_TTL:-172800}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?Set ALLOWED_HOSTS in .env}
      - EMAIL_BACKEND=${EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - EMAIL_HOST=${EMAIL_HOST:-}
      - EMAIL_PORT=${EMAIL_PORT:-587}
      - EMAIL_USE_TLS=${EMAIL_USE_TLS:-True}
      - EMAIL_HOST_USER=${EMAIL_HOST_USER:-}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD:-}
      - DEFAULT_FROM_EMAIL=${DEFAULT_FROM_EMAIL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DJANGO_LOG_LEVEL=${DJANGO_LOG_LEVEL:-WARNING}
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H 'X-Forwarded-Proto: https' http://127.0.0.1:8000/ >/dev/null"]
      interval: 20s
      timeout: 7s
      retries: 5
      start_period: 30s
    mem_limit: 512m
    cpus: 0.22
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - "traefik.http.routers.vybra-web.rule=Host(`${TRAEFIK_HOST:-vybra.localhost}`)"
      - "traefik.http.routers.vybra-web.entrypoints=websecure"
      - "traefik.http.routers.vybra-web.tls.certresolver=letsencrypt"
      - "traefik.http.services.vybra-web.loadbalancer.server.port=8000"
    networks:
      - backend
      - traefik
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  media_data:
  postgres_data:

networks:
  backend:
    driver: bridge
  traefik:
    external: true
